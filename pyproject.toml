[project]
name = "explaind"
version = "0.5.2"
description = "Local CLI for steering Gemma 4 reasoning using structured prompt biases and ability-based cognitive control."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ollama",
    "rich>=13.0",
]

[project.scripts]
explaind = "explaind.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
